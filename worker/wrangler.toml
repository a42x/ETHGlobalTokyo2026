name = "benefit-office"
main = "src/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]
# ETHGlobal2026 account. Pinned so wrangler never falls back to the personal account.
account_id = "cc425fa275d25e4909170bc8063c82e4"

[vars]
CHAIN_ID = "80002"
RPC_URL = "https://polygon-amoy-bor-rpc.publicnode.com"
# BenefitOffice and BenefitAgeGate for real My Number cards (J-LIS roots), contracts/deployments/amoy.json.
# For JPKI-TEST test cards use office 0x7fA6E5a6DB7A45d2514Beb7F30c5F542A0EBD09f
# and gate 0x0662cDd6AEA98Ca840cB3001188be4EFBb635a14. claimHash includes the office, so set both together.
# The operator key is a secret: wrangler secret put OPERATOR_PRIVATE_KEY
BENEFIT_OFFICE_ADDRESS = "0xdD042C51Ae39902C1C49b9c1D28BA1B0Ce74d104"
BENEFIT_AGE_GATE_ADDRESS = "0x176d7299c1a118356fdd8Ed0D15A68B8FCf45803"
AGE_VERIFIER_ADDRESS = "0xb89d8e0c4a345ead852ab919548734c4f506596c"
JPYC_ADDRESS = "0xE7C3D8C9a439feDe00D2600032D5dB0Be71C3c29"
CORS_ORIGINS = "https://miniapp-playground.web.app,https://miniapp-playground--*.web.app"
AGENT_MODEL = "claude-opus-5"

[[d1_databases]]
binding = "CLAIMS"
database_name = "benefit-office"
database_id = "0cb0642c-5c8f-4ab1-b231-ce5bbdf165b5"
